<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Yurak</title>
    <script>
      // Applied before React mounts (and before first paint) so an explicit
      // light/dark pick doesn't flash the system theme first — matches the
      // "system" = no attribute convention in theme/ThemeContext.tsx.
      try {
        var t = localStorage.getItem("yurak.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
