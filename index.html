<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Primary Meta Tags -->
    <title>Yurak — Faollik va Tarmoq Telemetriyasi Platformasi</title>
    <meta name="title" content="Yurak — Faollik va Tarmoq Telemetriyasi Platformasi" />
    <meta
      name="description"
      content="Android, Windows va veb-brauzerlar uchun markazlashgan telemetriya platformasi. Operatsion tizim darajasidagi 1:1 aniq ekran vaqti, ilovalar faolligi va tarmoq trafigi hisoboti."
    />
    <meta
      name="keywords"
      content="yurak, telemetriya, ekran vaqti, monitoring, tarmoq sarfi, ilovalar tahlili, digital wellbeing, o'zbekiston, screen time, network telemetry"
    />
    <meta name="author" content="Yurak" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://yurak.ismaaiiyl.me/" />
    <meta name="theme-color" content="#0e131f" />

    <!-- Google Search Console Verification Meta Tag -->
    <!-- Google Search Console'dan olingan tasdiqlash kodini shu yerga qo'yishingiz mumkin: -->
    <!-- <meta name="google-site-verification" content="SIZNING_KODINGIZ" /> -->

    <!-- Open Graph / Facebook / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yurak.ismaaiiyl.me/" />
    <meta property="og:title" content="Yurak — Faollik va Tarmoq Telemetriyasi Platformasi" />
    <meta
      property="og:description"
      content="Android, Windows va brauzerlar uchun markazlashgan telemetriya tizimi. 100% shaxsiy daxlsizlik va ochiq tahlillar."
    />
    <meta property="og:image" content="https://yurak.ismaaiiyl.me/logo.png" />
    <meta property="og:site_name" content="Yurak" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://yurak.ismaaiiyl.me/" />
    <meta name="twitter:title" content="Yurak — Faollik va Tarmoq Telemetriyasi" />
    <meta
      name="twitter:description"
      content="Operatsion tizim darajasidagi aniq ekran vaqti va tarmoq sarfi tahlili."
    />
    <meta name="twitter:image" content="https://yurak.ismaaiiyl.me/logo.png" />

    <!-- Structured Data (JSON-LD) for Google Search Rich Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Yurak",
        "url": "https://yurak.ismaaiiyl.me",
        "description": "Android, Windows va veb-brauzerlar uchun markazlashgan telemetriya va ekran vaqti tahlili platformasi.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Android, Windows 10/11, Chromium",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <script>
      // Applied before React mounts (and before first paint) so an explicit
      // light/dark pick doesn't flash the system theme first — matches the
      // "system" = no attribute convention in theme/ThemeContext.tsx.
      try {
        var t = localStorage.getItem("yurak.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
